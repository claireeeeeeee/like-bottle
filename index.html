<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>喜欢度瓶子</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--text:#24262b;--muted:#8b90a0;--accent:#9ba8ff;--accent2:#6f7ff0;--line:#e6e9f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#fbfbfe,#f2f4f8);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.page{width:min(620px,100%);margin:auto;padding:20px 14px 36px}.hidden{display:none!important}
.panel,.card,.result,.editor-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 22px rgba(50,60,100,.05)}
.start-card{margin-top:40px;text-align:center;padding:30px 18px 24px}.title{font-size:28px;font-weight:800;margin:0 0 22px}
.role-switch{display:flex;gap:8px;margin-bottom:14px;background:#f1f3f8;padding:4px;border-radius:14px}.role-btn{flex:1;padding:10px 12px;border-radius:11px;background:transparent;color:#737988;font-size:14px}.role-btn.active{background:#fff;color:#24262b;box-shadow:0 3px 10px rgba(40,50,80,.07)}
.name-input,.code-input{width:100%;border:1px solid #dfe3eb;border-radius:14px;padding:14px;font-size:16px;background:#fafbfe;margin-bottom:12px;outline:none}
button{appearance:none;-webkit-appearance:none;border:none;cursor:pointer;font-weight:700}.main-btn,.submit-btn{background:#22252b;color:#fff;border-radius:16px;padding:14px 16px;font-size:16px;box-shadow:0 6px 16px rgba(40,50,80,.08)}.main-btn{width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}h1{font-size:24px;margin:0}.respondent{text-align:center;font-size:13px;color:#7b8190;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:14px}.card{padding:18px 16px 16px}.name{text-align:center;font-size:18px;font-weight:700;margin-bottom:10px}
.bottle-zone{height:245px;display:flex;align-items:center;justify-content:center}.bottle-shell{position:relative;width:118px;height:210px;margin-top:16px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:ns-resize;transition:transform .15s}.card.adjusting .bottle-shell{transform:scale(1.05)}.card.adjusting .bottle,.card.adjusting .neck,.card.adjusting .lip{border-color:var(--accent2)}.hint{text-align:center;font-size:12px;color:var(--muted);margin:-8px 0 14px}.bottle{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:104px;height:178px;border:4px solid #596176;border-radius:18px 18px 28px 28px;overflow:hidden;background:#fff}.neck{position:absolute;left:50%;top:5px;transform:translateX(-50%);width:54px;height:40px;border:4px solid #596176;border-bottom:none;border-radius:11px 11px 0 0;background:#fff;z-index:3}.lip{position:absolute;left:50%;top:0;transform:translateX(-50%);width:68px;height:14px;border:4px solid #596176;border-radius:10px;background:#fff;z-index:4}.liquid{position:absolute;left:0;bottom:0;width:100%;height:50%;background:linear-gradient(180deg,var(--accent),var(--accent2));transition:height .05s linear}.surface{position:absolute;top:-8px;left:-8%;width:116%;height:18px;border-radius:50%;background:rgba(255,255,255,.3)}.percent{text-align:center;font-size:28px;font-weight:800;margin-top:6px}
.part-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 22px rgba(50,60,100,.05);font-size:17px;color:var(--text);text-align:left}.part-meta{display:flex;align-items:center;gap:10px;flex-shrink:0}.part-count{font-size:13px;color:var(--muted);font-weight:600}.part.done .part-count{color:#5563c9}.chev{font-size:22px;line-height:1;color:var(--muted);transition:transform .2s}.part.open .chev{transform:rotate(90deg)}.part-body{display:flex;flex-direction:column;gap:14px;margin-top:12px}.part:not(.open) .part-body{display:none}.done-btn{width:100%;padding:14px 16px;border-radius:16px;background:#edf0ff;color:#5563c9;font-size:15px}.result-meta{font-size:13px;color:var(--muted);margin:-6px 0 12px}.result-meta:empty{display:none}.redo-btn{width:100%;margin-top:12px}.editor-tip{font-size:13px;color:var(--muted);line-height:1.6;margin:-4px 0 10px}
.actions{display:flex;gap:10px;margin-top:18px;position:sticky;bottom:10px}.sub-btn{flex:1;padding:14px 16px;font-size:15px;background:#e9ecf3;color:#404653;border-radius:16px}.submit-btn{flex:2}
.result{display:none;margin-top:18px;padding:16px}.result h2{font-size:20px;margin:0 0 12px}.warehouse{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}.person-cell{min-height:104px;border-radius:18px;padding:12px 10px;background:linear-gradient(180deg,#fff,#f8f9ff);border:1px solid #e7ebf3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.person-mark{width:28px;height:28px;border-radius:50%;background:#edf0ff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-bottom:8px;color:#6472d4}.cell-name{font-size:15px;font-weight:800}.cell-score{margin-top:5px;font-size:13px;color:#676f86}.empty-board{padding:20px 14px;border-radius:16px;background:#fff;border:1px solid #e7ebf3;color:#7c8395;font-size:14px;text-align:center}.random-box{margin-top:14px;padding:14px;background:#f8f9fc;border:1px solid #e8ebf2;border-radius:18px;text-align:center}.random-btn{width:100%;padding:13px 14px;border-radius:14px;background:#22252b;color:#fff;font-size:15px}.random-btn:disabled{background:#cfd3dc}.picked{margin-top:12px;min-height:24px;font-size:18px;font-weight:800}
.editor-card{padding:16px}.editor-card h2{font-size:20px;margin:0 0 12px}.batch-editor{width:100%;min-height:320px;resize:vertical;border:1px solid #dfe3eb;border-radius:14px;padding:14px;font-size:15px;line-height:1.7;background:#fafbfe;color:#222;outline:none;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}.editor-actions{display:flex;gap:10px;margin-top:10px}.editor-actions button{flex:1}.status{font-size:13px;color:#6c7383;margin-top:10px;min-height:18px}.submissions{margin-top:18px}.submission{padding:12px;border:1px solid #e7ebf3;border-radius:14px;margin-top:8px;background:#fafbfe}.submission-head{display:flex;justify-content:space-between;gap:8px;font-size:13px}.submission-name{font-weight:800}.submission-time{color:#8b90a0}.submission-body{margin-top:8px;font-size:13px;line-height:1.6;color:#555e72}.error-box{margin-top:12px;padding:12px;border-radius:12px;background:#fff3f3;color:#9b4242;font-size:13px;line-height:1.5}
@media(max-width:430px){.page{padding:18px 12px 32px}.bottle-zone{height:228px}.warehouse{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<main class="page">
<section id="setupError" class="panel start-card hidden"><div class="title">需要连接数据库</div><div class="error-box">请先在 index.html 里填写 SUPABASE_URL 和 SUPABASE_ANON_KEY。</div></section>
<section id="startSection" class="panel start-card">
<div class="title">喜欢度瓶子</div>
<div class="role-switch"><button id="playerRoleBtn" class="role-btn active">玩家</button><button id="editorRoleBtn" class="role-btn">编辑模式</button></div>
<div id="playerLogin"><input id="respondentInput" class="name-input" placeholder="请输入名字"><button id="startBtn" class="main-btn">开始</button></div>
<div id="editorLogin" class="hidden"><input id="editorCodeInput" class="code-input" placeholder="请输入暗号" type="password"><button id="editorStartBtn" class="main-btn">进入编辑</button></div>
</section>
<section id="surveySection" class="hidden"><div class="topbar"><h1>喜欢度瓶子</h1></div><div class="respondent" id="respondentLine"></div><div class="hint">按住瓶子一下，再上下拖动调整；其他地方可以正常滑动</div><section class="list" id="list"></section><div class="actions"><button class="sub-btn" id="resetBtn">重置</button><button class="submit-btn" id="submitBtn">提交</button></div></section>
<section class="result" id="resultBox"><h2 id="resultTitle">结果</h2><div id="resultMeta" class="result-meta"></div><div id="warehouseArea"></div><div class="random-box"><button class="random-btn" id="randomBtn">随机一个</button><div class="picked" id="pickedResult"></div></div><button id="redoBtn" class="sub-btn redo-btn hidden">重新填写</button></section>
<section id="editorSection" class="hidden"><div class="editor-card"><h2>批量编辑</h2><div class="editor-tip">每一行一个小瓶子；用 # 开头的一行写大类名，下面的瓶子都归到这个大类。不写大类就是普通列表。</div><textarea id="batchEditor" class="batch-editor" placeholder="# Part 1&#10;人物 A&#10;人物 B&#10;&#10;# Part 2&#10;人物 C&#10;人物 D"></textarea><div class="editor-actions"><button id="reloadBtn" class="sub-btn">重新读取</button><button id="batchSaveBtn" class="submit-btn">保存</button></div><div id="editorStatus" class="status"></div><div class="submissions"><h2>玩家提交</h2><button id="loadSubmissionsBtn" class="sub-btn" style="width:100%">刷新记录</button><div id="submissionsList"></div></div></div></section>
</main>
<script>
const SUPABASE_URL = "https://qegkgtkknxyzvqewxviv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Cm4IPDN8P0mV7V8jZ8-kDQ_GjCGMZkU";
const $=id=>document.getElementById(id);let db=null,people=[],eligiblePeople=[],respondentName="",editorCode="";
function configured(){return !SUPABASE_URL.startsWith("PASTE_")&&!SUPABASE_ANON_KEY.startsWith("PASTE_")}
if(!configured()){$("startSection").classList.add("hidden");$("setupError").classList.remove("hidden")}else{db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}
$("playerRoleBtn").onclick=()=>setRole("player");$("editorRoleBtn").onclick=()=>setRole("editor");
function setRole(role){const e=role==="editor";$("playerRoleBtn").classList.toggle("active",!e);$("editorRoleBtn").classList.toggle("active",e);$("playerLogin").classList.toggle("hidden",e);$("editorLogin").classList.toggle("hidden",!e)}
async function fetchBottles(){const{data,error}=await db.from("bottles").select("id,name,category,sort_order").order("sort_order",{ascending:true}).order("id",{ascending:true});if(error)throw error;people=(data||[]).map(x=>({...x,value:50}))}
$("startBtn").onclick=async()=>{const name=$("respondentInput").value.trim();if(!name)return alert("请输入名字");respondentName=name;try{await fetchBottles();if(!people.length)return alert("现在还没有小瓶子");const prev=await fetchLastSubmission(name);$("startSection").classList.add("hidden");$("respondentLine").textContent=name;if(prev)showHistory(prev);else{$("surveySection").classList.remove("hidden");renderCards()}}catch(e){alert("读取失败："+e.message)}};
// 同名玩家以前提交过：直接显示最近一次结果；查询失败时当作新玩家，不影响正常填写
async function fetchLastSubmission(name){const{data,error}=await db.rpc("player_get_latest_submission",{p_name:name});if(error){console.warn("读取历史失败",error);return null}return data&&data.ok===true?data.submission:null}
function showHistory(sub){const answers=sub.answers||[],byName=new Map(answers.map(a=>[a.name,Number(a.value)]));people.forEach(p=>{if(byName.has(p.name))p.value=byName.get(p.name)});eligiblePeople=answers.filter(x=>Number(x.value)>=80).sort((a,b)=>b.value-a.value);$("resultTitle").textContent=respondentName+" 的结果";$("resultMeta").textContent="上次提交："+new Date(sub.created_at).toLocaleString();$("pickedResult").textContent="";renderWarehouse();$("redoBtn").classList.remove("hidden");$("resultBox").style.display="block"}
$("redoBtn").onclick=()=>{$("resultBox").style.display="none";$("redoBtn").classList.add("hidden");$("surveySection").classList.remove("hidden");renderCards();window.scrollTo({top:0})};
$("editorStartBtn").onclick=async()=>{const code=$("editorCodeInput").value.trim();if(!code)return alert("请输入暗号");editorCode=code;try{const{data,error}=await db.rpc("editor_get_bottles",{p_code:code});if(error)throw error;if(!data||data.ok!==true)return alert("暗号不对");$("startSection").classList.add("hidden");$("editorSection").classList.remove("hidden");applyEditorBottleData(data.bottles||[]);await loadSubmissions()}catch(e){alert("进入失败："+e.message)}};
function applyEditorBottleData(rows){const lines=[];let cat="";rows.forEach(x=>{const c=x.category||"";if(c!==cat){if(lines.length)lines.push("");lines.push("# "+c);cat=c}lines.push(x.name)});$("batchEditor").value=lines.join("\n")}
function parseBatch(text){const names=[],categories=[];let cat="";text.split(/\r?\n/).forEach(raw=>{const line=raw.trim();if(!line)return;if(line.startsWith("#"))cat=line.replace(/^#+/,"").trim();else{names.push(line);categories.push(cat)}});return{names,categories}}
$("reloadBtn").onclick=async()=>{setEditorStatus("读取中…");const{data,error}=await db.rpc("editor_get_bottles",{p_code:editorCode});if(error)return setEditorStatus("读取失败："+error.message);if(!data||data.ok!==true)return setEditorStatus("暗号失效");applyEditorBottleData(data.bottles||[]);setEditorStatus("已重新读取")};
$("batchSaveBtn").onclick=async()=>{const{names,categories}=parseBatch($("batchEditor").value);if(!names.length)return alert("至少保留一个小瓶子");setEditorStatus("保存中…");const{data,error}=await db.rpc("editor_replace_bottles",{p_code:editorCode,p_names:names,p_categories:categories});if(error)return setEditorStatus("保存失败："+error.message);if(!data||data.ok!==true)return setEditorStatus("保存失败：暗号不正确");applyEditorBottleData(data.bottles||[]);setEditorStatus("已保存，玩家刷新后会看到新列表")};
function setEditorStatus(t){$("editorStatus").textContent=t}
function makeCard(person){const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="name"></div><div class="bottle-zone"><div class="bottle-shell"><div class="lip"></div><div class="neck"></div><div class="bottle"><div class="liquid" style="height:${person.value}%"><div class="surface"></div></div></div></div></div><div class="percent">${person.value}%</div>`;card.querySelector(".name").textContent=person.name;const shell=card.querySelector(".bottle-shell"),bottle=card.querySelector(".bottle"),liquid=card.querySelector(".liquid"),percent=card.querySelector(".percent");
// 手机：按住约 0.2 秒不动才进入调整，期间手指一移动就当作正常滚动页面；调整按相对位移计算，按下时数值不会跳
const HOLD_MS=200,MOVE_TOLERANCE=8;let active=false,timer=null,tid=null,x0=0,y0=0,lastY=0,startY=0,startV=0;
function set(v){v=Math.max(0,Math.min(100,Math.round(v)));person.value=v;liquid.style.height=v+"%";percent.textContent=v+"%"}
function begin(y){active=true;startY=y;startV=person.value;card.classList.add("adjusting");if(navigator.vibrate)navigator.vibrate(10)}
function move(y){set(startV+(startY-y)/bottle.getBoundingClientRect().height*100)}
function end(){clearTimeout(timer);timer=null;tid=null;active=false;card.classList.remove("adjusting")}
const own=e=>[...e.changedTouches].find(t=>t.identifier===tid);
shell.addEventListener("touchstart",e=>{if(e.touches.length!==1)return end();const t=e.touches[0];tid=t.identifier;x0=t.clientX;y0=lastY=t.clientY;timer=setTimeout(()=>{timer=null;begin(lastY)},HOLD_MS)},{passive:true});
shell.addEventListener("touchmove",e=>{const t=own(e);if(!t)return;lastY=t.clientY;if(active){e.preventDefault();move(t.clientY)}else if(timer&&Math.hypot(t.clientX-x0,t.clientY-y0)>MOVE_TOLERANCE){clearTimeout(timer);timer=null}},{passive:false});
["touchend","touchcancel"].forEach(n=>shell.addEventListener(n,e=>{if(own(e))end()}));
shell.addEventListener("contextmenu",e=>e.preventDefault());
// 电脑鼠标：直接拖动
shell.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;try{shell.setPointerCapture(e.pointerId)}catch(_){}begin(e.clientY);e.preventDefault()});
shell.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"&&active)move(e.clientY)});
["pointerup","pointercancel"].forEach(n=>shell.addEventListener(n,e=>{if(e.pointerType==="mouse")end()}));
return card}
// 按顺序把相邻、同大类的瓶子分成一组
function groupPeople(){const groups=[];people.forEach(p=>{const c=p.category||"";let g=groups[groups.length-1];if(!g||g.name!==c){g={name:c,items:[]};groups.push(g)}g.items.push(p)});return groups}
function renderCards(){const list=$("list");list.innerHTML="";const groups=groupPeople();if(groups.length===1&&!groups[0].name){groups[0].items.forEach(p=>list.appendChild(makeCard(p)));return}
const parts=groups.map((g,i)=>{const sec=document.createElement("section");sec.className="part"+(i===0?" open":"");sec.innerHTML='<button class="part-head" type="button"><span class="part-title"></span><span class="part-meta"><span class="part-count"></span><span class="chev">›</span></span></button><div class="part-body"></div>';sec.querySelector(".part-title").textContent=g.name||"其他";const count=sec.querySelector(".part-count"),setCount=()=>count.textContent=g.items.length+" 个"+(sec.classList.contains("done")?" · 已完成":"");setCount();const body=sec.querySelector(".part-body");g.items.forEach(p=>body.appendChild(makeCard(p)));const done=document.createElement("button");done.type="button";done.className="done-btn";done.textContent=i===groups.length-1?"这部分完成，收起":"这部分完成，下一部分";done.onclick=()=>{sec.classList.add("done");sec.classList.remove("open");setCount();const next=parts[i+1];if(next)next.classList.add("open");(next||sec).scrollIntoView({behavior:"smooth",block:"start"})};body.appendChild(done);sec.querySelector(".part-head").onclick=()=>sec.classList.toggle("open");list.appendChild(sec);return sec})}
$("resetBtn").onclick=()=>{people.forEach(p=>p.value=50);renderCards();$("resultBox").style.display="none"};
$("submitBtn").onclick=async()=>{const answers=people.map(p=>({bottle_id:p.id,name:p.name,category:p.category||"",value:p.value}));const{error}=await db.from("submissions").insert({player_name:respondentName,answers});if(error)return alert("提交失败："+error.message);eligiblePeople=answers.filter(x=>x.value>=80).sort((a,b)=>b.value-a.value);$("resultTitle").textContent=respondentName+" 的结果";$("resultMeta").textContent="";$("redoBtn").classList.add("hidden");$("pickedResult").textContent="";renderWarehouse();$("resultBox").style.display="block";$("resultBox").scrollIntoView({behavior:"smooth",block:"start"})};
function renderWarehouse(){const area=$("warehouseArea");area.innerHTML="";if(!eligiblePeople.length){const e=document.createElement("div");e.className="empty-board";e.textContent="暂无 80% 以上";area.appendChild(e);$("randomBtn").disabled=true;return}const grid=document.createElement("div");grid.className="warehouse";eligiblePeople.forEach((p,i)=>{const cell=document.createElement("div");cell.className="person-cell";cell.innerHTML=`<div class="person-mark">${i+1}</div><div class="cell-name"></div><div class="cell-score">${p.value}%</div>`;cell.querySelector(".cell-name").textContent=p.name;grid.appendChild(cell)});area.appendChild(grid);$("randomBtn").disabled=false}
$("randomBtn").onclick=()=>{if(!eligiblePeople.length)return;$("randomBtn").disabled=true;$("pickedResult").textContent="";let c=0;const timer=setInterval(()=>{const p=eligiblePeople[Math.floor(Math.random()*eligiblePeople.length)];$("pickedResult").textContent=p.name;if(++c>=10){clearInterval(timer);$("pickedResult").textContent=eligiblePeople[Math.floor(Math.random()*eligiblePeople.length)].name;$("randomBtn").disabled=false}},90)};
$("loadSubmissionsBtn").onclick=loadSubmissions;
async function loadSubmissions(){$("submissionsList").innerHTML='<div class="status">读取中…</div>';const{data,error}=await db.rpc("editor_get_submissions",{p_code:editorCode,p_limit:100});if(error){$("submissionsList").innerHTML='<div class="error-box">读取失败：'+escapeHtml(error.message)+'</div>';return}if(!data||data.ok!==true){$("submissionsList").innerHTML='<div class="error-box">暗号不正确</div>';return}const rows=data.submissions||[];if(!rows.length){$("submissionsList").innerHTML='<div class="status">还没有提交记录</div>';return}$("submissionsList").innerHTML="";rows.forEach(row=>{const box=document.createElement("div");box.className="submission";const picked=(row.answers||[]).filter(x=>Number(x.value)>=80).map(x=>`${x.name} ${x.value}%`).join("、")||"无 80% 以上";box.innerHTML='<div class="submission-head"><span class="submission-name"></span><span class="submission-time"></span></div><div class="submission-body"></div>';box.querySelector(".submission-name").textContent=row.player_name;box.querySelector(".submission-time").textContent=new Date(row.created_at).toLocaleString();box.querySelector(".submission-body").textContent=picked;$("submissionsList").appendChild(box)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
